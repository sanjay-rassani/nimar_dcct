services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nimar_dcct}
      POSTGRES_USER: ${POSTGRES_USER:-nimar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimar_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimar} -d ${POSTGRES_DB:-nimar_dcct}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Postgres is internal to the Compose network (no host port publish).

  web:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nimar}:${POSTGRES_PASSWORD:-nimar_dev_password}@db:5432/${POSTGRES_DB:-nimar_dcct}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
